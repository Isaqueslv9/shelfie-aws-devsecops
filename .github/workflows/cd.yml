name: CD — Deploy de Infraestrutura e Aplicação para AWS

on:
  push:
    branches:
      - main

    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - 'images/**'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: read

jobs:

  terraform-apply:
    name: aplicar infra do terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:      
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform init
        run: terraform init
        working-directory: infra

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="aws_account_id=${{ secrets.AWS_ACCOUNT_ID }}"
        working-directory: infra

  build-and-deploy:
    name: Build, Push e deploy no ECS
    runs-on: ubuntu-latest
    needs: terraform-apply

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login no ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Definir tag da imagem
        id: vars
        run: echo "IMAGE_TAG=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build e push imagem PHP
        run: |
          docker build -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_APP }}:${{ steps.vars.outputs.IMAGE_TAG }} ./app
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_APP }}:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: Build e push imagem Nginx
        run: |
          docker build -f nginx/dockerfile -t ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_NGINX }}:${{ steps.vars.outputs.IMAGE_TAG }} .
          docker push ${{ secrets.ECR_REGISTRY }}/${{ secrets.ECR_REPOSITORY_NGINX }}:${{ steps.vars.outputs.IMAGE_TAG }}

      - name: deploy no ECS da nova imagem (força atualização com nova imagem)
        run: |
          aws ecs update-service \
            --cluster ${{ secrets.ECS_CLUSTER }} \
            --service ${{ secrets.ECS_SERVICE }} \
            --force-new-deployment \
            --region ${{ secrets.AWS_REGION }}

      - name: Deploy concluído
        run: echo "Infra atualizada e nova versão do app implantada no ECS com sucesso"