name: CI — Build da imagem, verificação de Segurança e Infraestrutura

on:
  push:
    branches:
      - develop

    paths-ignore:
      - 'README.md'
      - 'assets/**'
      - 'images/**'
      - 'docs/**'
      - '.gitignore'

permissions:
  contents: read
  security-events: write

jobs:

  build-and-scan:
    name: Build e Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan com gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build imagem PHP
        run: docker build -t shelfie-app:ci ./app

      - name: Build imagem Nginx
        run: docker build -f nginx/dockerfile -t shelfie-nginx:ci .

      - name: Scan imagem PHP com Trivy
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: shelfie-app:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Scan imagem Nginx com Trivy
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: shelfie-nginx:ci
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Scan de codigo com semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: >
            p/php
            p/secrets
            p/owasp-top-ten

      - name: Scan com SonarCloud
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  terraform-validate:
      name: terraform validade e plan
      runs-on: ubuntu-latest
      needs: build-and-scan
      steps:
        - uses: actions/checkout@v4

        - uses: hashicorp/setup-terraform@v3
          with:
            terraform_version: "1.8.0"

        - name: Configurar credenciais AWS
          uses: aws-actions/configure-aws-credentials@v4
          with:      
            aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws-region: ${{ secrets.AWS_REGION }}

        - name: Terraform init
          run: terraform init
          working-directory: infra
            
        - name: Terraform Format Check
          run: terraform fmt -check -recursive
          working-directory: infra

        - name: Terraform Validate
          run: terraform validate
          working-directory: infra

        - name: Criar terraform.tfvars
          run: |
            cat > terraform.tfvars <<EOF
            project_name             = "shelfie"
            environment              = "production"
            aws_region               = "us-east-1"
            aws_account_id           = "${{ secrets.AWS_ACCOUNT_ID }}"
            vpc_cidr                 = "10.0.0.0/16"
            availability_zones       = ["us-east-1a", "us-east-1b"]
            db_instance_class        = "db.t3.micro"
            db_name                  = "shelfie"
            db_username              = "admin"
            db_allocated_storage     = 20
            db_multi_az              = false
            db_backup_retention_days = 7
            task_cpu                 = "512"
            task_memory              = "1024"
            service_desired_count    = 1
            acm_certificate_arn      = ""
            EOF
          working-directory: infra


        - name: Terraform Plan
          id: plan
          run: terraform plan -out=tfplan -no-color 2>&1 | tee plan_output.txt
          working-directory: infra
        - name: CI concluído
          run: echo "Build, verificações com Trivy, Semgrep e validação de Infra passaram. Código validado para PR"